name: Verify public online relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-relay:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check local relay integration
        run: python -m unittest -q verify_online_rooms
      - name: Check published WSS relay
        run: python verify_public_relay.py --report build_output/public_relay_check.json
      - name: Save verification report
        uses: actions/upload-artifact@v4
        with:
          name: AmberaFarm-PublicRelay-Verification
          path: build_output/public_relay_check.json
