name: Build Ambera Farm Admin Editor EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-editor:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Windows EXEs using existing verified build script
        shell: pwsh
        run: |
          python build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'build_output/exe/AmberaStoryEditor.exe')) {
            throw 'AmberaStoryEditor.exe not created'
          }

      - name: Upload admin editor EXE as Actions artifact only
        uses: actions/upload-artifact@v4
        with:
          name: AmberaFarm-AdminEditor-Windows
          path: build_output/exe/AmberaStoryEditor.exe
          if-no-files-found: error
          retention-days: 7
